# Package sets per feature unit.
#
# Consumed by .chezmoiscripts/run_onchange_before_10-install-packages.sh.tmpl,
# which concatenates the sets for the units enabled in the machine-local
# manifest (~/.config/chezmoi/chezmoi.toml, [data.features]) plus the driver set
# for data.gpu, then hands the result to pacman/yay with --needed.
#
# Platform split (data.platform): `base` and `work` are headless-safe and install
# everywhere. `desktop` and `workDesktop` only install on native machines; on
# "wsl" the installer also skips content, gaming and the GPU set. Every package
# lives in exactly one set.
#
# SCOPE: userland only. The kernel, bootloader, microcode, initramfs hooks and
# hardware-specific drivers (fingerprint, wifi dongles, headsets) are the
# installer's job, not chezmoi's — installing them from here would push GRUB
# onto a Limine machine or amd-ucode onto an Intel one. They are deliberately
# absent from these lists.
#
# DISTRO: these names resolve against CachyOS repos. Most of what CachyOS ships
# is a same-name rebuild of an Arch package, so the lists work on plain Arch
# too — except for a handful CachyOS packages itself and Arch keeps in the AUR:
# brave-bin, claude-code, claude-desktop, neovim-git, pokemon-colorscripts-git,
# zen-browser-bin. On a non-CachyOS Arch box, move those to the `aur`
# list of their unit.
#
# Regenerate a snapshot of a machine's current state with:
#   pacman -Qqen   # native, explicitly installed
#   pacman -Qqem   # AUR / foreign, explicitly installed

# --------------------------------------------------------------------------
# base — always installed, on every platform: shell, git, editors, everyday
# CLI. Everything here must be useful headless (WSL2 gets exactly this).
# --------------------------------------------------------------------------
[packages.base]
pacman = [
  "7zip",
  "atuin",
  "base-devel",
  "bat",
  "btop",
  "chezmoi",
  "cpio",
  "dosfstools",
  "eza",
  "fastfetch",
  "fd",
  "ffmpegthumbnailer",
  "fish",
  "fzf",
  "git",
  "gum",
  "imagemagick",
  "jq",
  "man-db",
  "man-pages",
  "neovim-git",
  "openssh",
  "pacman-contrib",
  "parallel",
  "pokemon-colorscripts-git",
  "rbw",
