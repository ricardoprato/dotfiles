# --------------------------------------------------------------------------
# gaming — Steam/Proton, the gamescope+gamemode+MangoHud runtime, Wine, and
# emulation. lib32-* here is why this unit needs [multilib]; the install
# script enables that repo when the unit is on.
# --------------------------------------------------------------------------
[packages.gaming]
pacman = [
  "dolphin-emu",
  # Local game streaming. moonlight-qt is the client; sunshine is the host and
  # stays inert until you enable it (systemctl --user enable --now sunshine), so
  # it is safe to ship on every gaming machine. Pair them and a weak laptop
  # plays whatever the strong desktop can render, at LAN latency.
  "moonlight-qt",
  "sunshine",
  "gamemode",
  "gamescope",
  "lib32-gamemode",
  "lib32-mangohud",
  "libretro-mgba",
  "libretro-snes9x",
  "mangohud",
  "retroarch",
  "retroarch-assets-xmb",
  "steam",
  "steam-devices",
  "ttf-liberation",
  "vulkan-tools",
  "wine",
  "wine-gecko",
  "wine-mono",
  "winetricks",
]
aur = [
  "heroic-games-launcher-bin",
  "protonup-qt",
]

# --------------------------------------------------------------------------
# GPU driver sets, selected by data.gpu (autodetected from lspci at
# `chezmoi init`, overridable in the machine-local manifest).
#
#   pacman   — always installed, the desktop needs them
#   pacman32 — 32-bit userspace, only installed when the gaming unit is on
#              (nothing else on this system needs multilib)
# --------------------------------------------------------------------------
[gpuPackages.amd]
pacman = ["mesa", "vulkan-radeon", "vulkan-mesa-layers", "vulkan-tools"]
pacman32 = ["lib32-mesa", "lib32-vulkan-radeon", "lib32-vulkan-mesa-layers"]
aur = ["lact"]

[gpuPackages.nvidia]
pacman = [
  "egl-wayland",
  "libva-nvidia-driver",
  "nvidia-open-dkms",
  "nvidia-settings",
  "nvidia-utils",
  "vulkan-tools",
]
pacman32 = ["lib32-nvidia-utils"]
aur = []

[gpuPackages.intel]
pacman = ["intel-media-driver", "mesa", "vulkan-intel", "vulkan-mesa-layers", "vulkan-tools"]
pacman32 = ["lib32-mesa", "lib32-vulkan-intel"]
aur = []

# Fallback when lspci matched nothing recognisable (VMs, exotic hardware).
# Software rendering plus the loader — enough to reach a desktop and fix it.
[gpuPackages.unknown]
pacman = ["mesa", "vulkan-mesa-layers", "vulkan-swrast", "vulkan-tools"]
pacman32 = ["lib32-mesa", "lib32-vulkan-swrast"]
aur = []
