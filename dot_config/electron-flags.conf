# Keep every feature toggle on ONE --enable-features line, comma-separated.
# The wrapper (/usr/bin/electron39) passes each line as a separate argument, and
# Chromium stores switches in a map keyed by switch name, so a second
# --enable-features silently overrides the first. This file previously had two,
# which discarded WaylandWindowDecorations. Same rule applies to
# --disable-features (see brave-flags.conf).
--enable-features=WaylandWindowDecorations,WebRTCPipeWireCapturer
--ozone-platform-hint=auto
--enable-wayland-ime
