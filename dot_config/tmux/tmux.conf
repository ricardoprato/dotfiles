# Prefix
set -g prefix C-a
set -g prefix2 C-b
bind C-a send-prefix

# Config and help
bind q source-file ~/.config/tmux/tmux.conf \; display "Configuration reloaded"
bind ? display-popup -E -w 80% -h 70% -T "Tmux keybindings" "omarchy-menu-tmux-keybindings --print | less -R"

# Vi mode for copy
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Pane Controls
bind -n M-Enter split-window -v -c "#{pane_current_path}"
bind -n M-S-Enter split-window -h -c "#{pane_current_path}"
bind -n M-Escape kill-pane

bind h split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind x kill-pane

bind -n C-M-Left select-pane -L
bind -n C-M-Right select-pane -R
bind -n C-M-Up select-pane -U
bind -n C-M-Down select-pane -D

bind -n C-M-S-Left resize-pane -L 5
bind -n C-M-S-Down resize-pane -D 5
bind -n C-M-S-Up resize-pane -U 5
bind -n C-M-S-Right resize-pane -R 5

# Window navigation
bind r command-prompt -I "#W" "rename-window -- '%%'"
bind c new-window -c "#{pane_current_path}"
bind k kill-window

bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

bind -n M-Left select-window -t -1
bind -n M-Right select-window -t +1
bind -n M-S-Left swap-window -t -1 \; select-window -t -1
bind -n M-S-Right swap-window -t +1 \; select-window -t +1

# Session controls
bind R command-prompt -I "#S" "rename-session -- '%%'"
bind C new-session -c "#{pane_current_path}"
bind K kill-session
bind P switch-client -p
bind N switch-client -n

bind -n M-Up switch-client -p
bind -n M-Down switch-client -n

# General
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:RGB"
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -g escape-time 0
set -g focus-events on
set -g set-clipboard on
set -g allow-passthrough on
setw -g aggressive-resize on
set -g detach-on-destroy off
set -g extended-keys on
set -g extended-keys-format csi-u
set -sg escape-time 10

# Status bar (styled like kitty's powerline/slanted tab bar, Catppuccin Mocha)
set -g status-position bottom
set -g status-interval 5
set -g status-left-length 30
set -g status-right-length 50
set -g window-status-separator ""
set -gw automatic-rename on
set -gw automatic-rename-format '#{b:pane_current_path}'

# Theme
set -g status-style "bg=#181825,fg=#a6adc8"
set -g status-left "#[fg=#1e1e2e,bg=#89b4fa,bold] #S #[fg=#89b4fa,bg=#181825,nobold]\ue0bc"
set -g status-right "#[fg=#89b4fa]#{?pane_in_mode,COPY ,}#{?client_prefix,PREFIX ,}#{?window_zoomed_flag,ZOOM ,}#[fg=#313244]\ue0ba#[fg=#a6adc8,bg=#313244] #h "
set -g window-status-format "#[fg=#181825,bg=#313244]\ue0bc#[fg=#a6adc8,bg=#313244,italics] #I:#W #[fg=#313244,bg=#181825,noitalics]\ue0bc"
set -g window-status-current-format "#[fg=#181825,bg=#89b4fa]\ue0bc#[fg=#1e1e2e,bg=#89b4fa,bold,italics] #I:#W #[fg=#89b4fa,bg=#181825,nobold,noitalics]\ue0bc"
set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=blue"
set -g message-style "bg=default,fg=blue"
set -g message-command-style "bg=default,fg=blue"
set -g mode-style "bg=blue,fg=black"
setw -g clock-mode-colour blue

# Kitty graphics passthrough (snacks.image / yazi / kitty icat)
# allow-passthrough (above) lets APC graphics escapes reach kitty. The rest keeps
# image redraws quiet and TERM/TERM_PROGRAM fresh on re-attach so apps inside
# tmux can still detect kitty and pick the graphics protocol.
set -g visual-activity off
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# Seamless C-h/j/k/l between nvim splits and tmux panes (vim-tmux-navigator
# style, no plugin). kitty's navigate_kitty.py hands these keys to tmux; tmux then
# either forwards them to nvim/vim (which navigates its own splits and falls back
# to `tmux select-pane` at the edge, see nvim utils/kitty-nav.lua) or moves pane.
# The ps regexp matches vim/nvim/view/vimdiff etc. on the pane's tty.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?)(diff)?$'"
bind -n C-h if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind -n C-j if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind -n C-k if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind -n C-l if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'
bind -T copy-mode-vi C-h select-pane -L
bind -T copy-mode-vi C-j select-pane -D
bind -T copy-mode-vi C-k select-pane -U
bind -T copy-mode-vi C-l select-pane -R

# Alt keys mirroring kitty's tab keys, applied to tmux windows
# kitty's tmux_aware.py forwards these to tmux when tmux is the foreground
# process, so the same muscle memory works with and without tmux.
# (M-1..9 select-window already exist above.)
bind -n M-h previous-window
bind -n M-l next-window
bind -n M-t new-window -c "#{pane_current_path}"
bind -n M-w confirm-before -p "kill-window #W? (y/n)" kill-window

# sesh session picker (mirrors kitty's alt+d tab picker)
# --no-preview: FZF_DEFAULT_OPTS (env.fish) sets an image/bat preview that makes
# no sense for sesh entries. Runs the fish `tm` function so the picker is defined once.
set -g popup-border-lines rounded
set -g popup-border-style fg=blue
bind -n M-d display-popup -E -w 60% -h 60% -b rounded -S fg=blue -T " sesh " "fish -c tm"
