--ozone-platform=wayland
--ozone-platform-hint=wayland
--enable-features=TouchpadOverscrollHistoryNavigation
--password-store=basic

# Chromium's Ozone/Wayland code mishandles fractional scale factors: it clamps
# the scale in one place and uses it unclamped in another, so the negotiated
# surface size and the drawn buffer size disagree. Floating windows (extension
# popups like Bitwarden) get their bounds recomputed with the wrong factor on
# every focus/unfocus, which renders them partially and makes them flicker.
# This monitor runs at scale 1.60 (monitors.lua: omarchy_monitor_scale="auto").
#
# Upstream: hyprwm/Hyprland#11627, brave/brave-browser#46407,
#           issues.chromium.org/40934705
#
# Caveat: this is a feature flag, so it's unstable — it vanished in Chromium 146
# and came back in 148. Present in 150 (verified: `strings /opt/brave-bin/brave`).
# If a future update breaks it, the durable fixes are an integer monitor scale
# or wl-veil blocking wp_fractional_scale_manager_v1.
#
# Must stay the ONLY --disable-features line: the wrapper passes each line as a
# separate arg and Chromium lets a later --disable-features override earlier ones.
--disable-features=WaylandFractionalScaleV1
--load-extension=~/.config/chromium/extensions/copy-url
