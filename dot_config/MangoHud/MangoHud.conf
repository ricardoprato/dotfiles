# MangoHud — performance overlay. Managed by chezmoi, gaming unit.
# Starts hidden; toggle with Shift_R+F12. Full option reference:
#   /usr/share/doc/mangohud/MangoHud.conf.example

################################ behaviour ################################
# Hidden by default. An always-on overlay is a distraction during play and a
# liability in screenshots; it earns its place only while diagnosing.
no_display
toggle_hud=Shift_R+F12
toggle_logging=Shift_L+F2
toggle_fps_limit=Shift_L+F1

################################# what to show #############################
fps
frametime
frame_timing=1
gpu_stats
gpu_temp
gpu_load_change
cpu_stats
cpu_temp
cpu_load_change
# VRAM on an integrated GPU reports only the BIOS carveout (often 512M-1G) and
# says nothing useful — system RAM is the real budget there. Both are shown so
# the number that matters is present on either kind of machine.
vram
ram
swap
resolution
vulkan_driver
# Surfaces whether the CPU/GPU is being held back by power or temperature,
# which on a laptop is the answer to "why did my fps drop" most of the time.
throttling_status
# Confirms gamemode actually engaged rather than being swallowed by a launcher.
gamemode
# No-ops on a desktop; on a laptop the wattage draw is the early warning that
# the chassis is about to throttle.
battery
battery_watt

################################# appearance ###############################
position=top-left
font_size=20
background_alpha=0.4
round_corners=8
table_columns=3

################################# logging ##################################
# Written on Shift_L+F2, read back with `mangoplot` or flightlessmango.com.
output_folder=/tmp
log_duration=30
autostart_log=0
